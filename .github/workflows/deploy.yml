
name: Backend CI and ECR Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Debug AWS Configuration
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "AWS Region: $REGION"
          echo "Role ARN: $ROLE_ARN"
          echo "GitHub Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"

      # Inspect OIDC claims BEFORE AWS authentication
      - name: Inspect GitHub OIDC Claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Could not retrieve GitHub OIDC token"
            exit 1
          fi

          PAYLOAD=$(TOKEN="$TOKEN" node -e \
            "console.log(Buffer.from(process.env.TOKEN.split('.')[1], 'base64url').toString())")

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            ref,
            repository_id,
            repository_owner_id
          }'

        shell: bash
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          PAYLOAD=$(TOKEN="$TOKEN" node -e \
            "console.log(Buffer.from(process.env.TOKEN.split('.')[1], 'base64url').toString())")

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            ref
          }'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
